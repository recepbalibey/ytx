[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytx"
version = "0.2.0"
description = "Convert YouTube videos, playlists, and channels into structured transcript datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "YTX Contributors" }]
keywords = ["youtube", "transcript", "subtitles", "dataset", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "youtube-transcript-api>=1.2,<2",
    "yt-dlp>=2025.1.1",
    "click>=8.1,<9",
    "rich>=13,<16",
]

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.1,<2",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/recepbalibey/ytx"
Issues = "https://github.com/recepbalibey/ytx/issues"

[project.scripts]
ytx = "ytx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytx"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring network access",
]
